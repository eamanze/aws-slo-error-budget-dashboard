global:
  resolve_timeout: 5m

route:
  receiver: incident-log
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: incident-log
      matchers: [severity="critical"]
      repeat_interval: 30m

receivers:
  - name: incident-log
    webhook_configs:
      - url: http://incident-receiver:8081/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [service]

