name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install --requirement app/requirements-dev.txt
      - run: ruff check app incident load-tests
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85 app/tests

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - name: Validate Prometheus configuration and rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - run: python -m json.tool monitoring/grafana/dashboards/slo-dashboard.json >/dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: false
          tags: sre-slo-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

